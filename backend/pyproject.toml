[project]
name = "mada"
version = "1.0.0"
description = "Multi-agent data analyst: profile, clean, analyse, chart, and report on a spreadsheet"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".venv", "__pycache__", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
    "E501",    # line length is handled by the formatter
    "B008",    # FastAPI's Depends() in defaults is the documented pattern
    "RUF012",  # mutable class attrs are fine for our agent config
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
no_implicit_optional = true
