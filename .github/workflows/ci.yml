name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint and test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint
        working-directory: backend
        run: ruff check .

      - name: Check formatting
        working-directory: backend
        run: ruff format --check .

      - name: Type check
        working-directory: backend
        run: mypy app --ignore-missing-imports
        continue-on-error: true

      - name: Test
        working-directory: backend
        env:
          DATABASE_URL: sqlite:///./ci.db
        run: pytest tests/ --cov=app --cov-report=term-missing --cov-report=xml

      - name: Verify the pipeline runs on real data
        working-directory: backend
        run: |
          python scripts/make_sample_data.py
          python -m app.cli ../data_samples/employees.csv --out /tmp/report.md
          test -s /tmp/report.md

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: backend/coverage.xml

  docker:
    name: Build image
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          tags: mada-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
